<style>
:root {

  --surface-hover: #f9f6f2;
  --border: #d9d0c5;
  --border-light: #e8e1d8;
  --text: #2c2418;
  --text-muted: #7a6e5f;
  --accent: #c0392b;
  --accent-hover: #a93226;
  --accent-soft: rgba(192,57,43,0.08);
  --accent-soft-border: rgba(192,57,43,0.18);
  --on-track: #2d7a38;
  --on-track-bg: rgba(45,122,56,0.1);
  --at-risk: #b87a0a;
  --at-risk-bg: rgba(184,122,10,0.1);
  --blocked: #c0392b;
  --blocked-bg: rgba(192,57,43,0.1);
  --launched: #6b4fa8;
  --launched-bg: rgba(107,79,168,0.1);
  --not-started: #6b6052;
  --not-started-bg: rgba(107,96,82,0.12);
  --in-tech: #2a6b8a;
  --in-tech-bg: rgba(42,107,138,0.1);
  --charlotte: #4a7fb5;
  --edx: #c87a32;
  --hen: #2d7a38;

  --partnerships: #a8892e;

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
.container { max-width:1200px; margin:0 auto; padding:24px; }
a { color:var(--accent); text-decoration:none; }
a:hover { text-decoration:underline; }

/* Header */
.header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
.header h1 { font-size:22px; font-weight:700; letter-spacing:-0.3px; }
.header .subtitle { color:var(--text-muted); font-size:13px; margin-top:2px; }
.header-badge { display:inline-block; background:var(--accent); color:#fff; font-size:10px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; padding:5px 12px; border-radius:4px; margin-bottom:6px; }


/* Stats bar */
.stats-bar { display:flex; gap:10px; margin-bottom:24px; flex-wrap:wrap; }
.stat-card { background:var(--surface); border:2px solid var(--border-light); border-radius:8px; padding:12px 18px; text-align:center; flex:1; min-width:100px; position:relative; cursor:pointer; transition:all 0.15s; }
.stat-card:hover { border-color:var(--border); transform:translateY(-1px); box-shadow:0 2px 8px rgba(0,0,0,0.06); }
.stat-card.active { border-color:currentColor; background:var(--surface); box-shadow:0 2px 8px rgba(0,0,0,0.08); }
.stat-card .value { font-size:24px; font-weight:700; }
.stat-card .label { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.4px; margin-top:1px; }
.stat-card .delta { font-size:10px; font-weight:700; margin-top:2px; }
.delta-up { color:var(--on-track); }
.delta-down { color:var(--accent); }
.delta-neutral { color:var(--text-muted); }

/* Movement indicator */
.mv-icon { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; font-size:10px; margin-right:4px; vertical-align:middle; flex-shrink:0; cursor:help; }
.mv-up { background:var(--on-track-bg); color:var(--on-track); }
.mv-down { background:var(--blocked-bg); color:var(--blocked); }
.mv-launch { background:var(--launched-bg); color:var(--launched); }

/* Executive Summary */
.tldr { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px 24px; margin-bottom:24px; }
.tldr h2 { font-size:13px; text-transform:uppercase; letter-spacing:0.5px; color:var(--accent); margin-bottom:14px; font-weight:700; }
.es-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.es-snapshot { font-size:13px; line-height:1.7; }
.es-snapshot .es-label { font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-muted); font-weight:600; margin-bottom:6px; }
.es-snapshot .es-metric { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid var(--border-light); }
.es-snapshot .es-metric:last-child { border-bottom:none; }
.es-snapshot .es-metric .es-val { font-weight:700; }
.es-freeze { margin-top:10px; padding:8px 12px; border-radius:6px; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px; }
.es-freeze.warn { background:var(--at-risk-bg); color:var(--at-risk); }
.es-freeze.ok { background:var(--on-track-bg); color:var(--on-track); }
.es-movements { font-size:13px; }
.es-movements .es-label { font-size:10px; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-muted); font-weight:600; margin-bottom:6px; }
.es-mv-item { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:5px 0; border-bottom:1px solid var(--border-light); }
.es-mv-item:last-child { border-bottom:none; }
.es-mv-name { flex:1; font-weight:500; }
.es-mv-pills { display:flex; align-items:center; gap:4px; flex-shrink:0; }
.es-mv-pills .pill { font-size:9px; padding:1px 6px; }
.es-mv-arrow { color:var(--text-muted); font-size:10px; }
.es-mv-detail { font-size:11px; color:var(--text-muted); margin-top:1px; }
@media (max-width:700px) { .es-grid { grid-template-columns:1fr; } }

/* Team nav */
.team-nav { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.team-btn { background:var(--surface); border:2px solid var(--border-light); color:var(--text); padding:13px 22px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.15s; display:flex; align-items:center; gap:8px; letter-spacing:0.1px; }
.team-btn:hover { transform:translateY(-2px); box-shadow:0 3px 12px rgba(0,0,0,0.08); }
.team-btn.active { color:#fff; }
.team-btn .count { opacity:0.75; font-size:11px; font-weight:500; }

/* Controls */
.controls { display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
.search-box { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:7px 12px; border-radius:6px; font-size:13px; width:220px; }
.search-box::placeholder { color:var(--text-muted); }
.filter-select { background:var(--surface); border:1px solid var(--border); color:var(--text); padding:7px 10px; border-radius:6px; font-size:12px; cursor:pointer; }
.view-toggle { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.view-toggle button { background:var(--surface); border:none; color:var(--text-muted); padding:7px 14px; font-size:12px; cursor:pointer; }
.view-toggle button.active { background:var(--accent); color:#fff; }
.filter-count { color:var(--text-muted); font-size:12px; margin-left:auto; }

/* Table */
.table-wrap { overflow-x:auto; margin-bottom:24px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
thead th { background:var(--surface); color:var(--text-muted); text-transform:uppercase; font-size:10px; letter-spacing:0.5px; padding:8px 12px; text-align:left; border-bottom:2px solid var(--border); cursor:pointer; user-select:none; white-space:nowrap; position:sticky; top:0; z-index:2; }
thead th:hover { color:var(--text); }
thead th .sort-icon { margin-left:4px; opacity:0.4; }
thead th.sorted .sort-icon { opacity:1; }
tbody tr { border-bottom:1px solid var(--border-light); transition:background 0.1s; }
tbody tr:hover { background:var(--surface); }
tbody tr.expanded { background:var(--surface); }
td { padding:9px 12px; vertical-align:top; }
td.name-cell { font-weight:500; max-width:220px; }
td.name-cell .init-name { cursor:pointer; }
.slack-link { display:inline-flex; align-items:center; gap:3px; margin-left:6px; color:var(--text-muted); font-size:10px; font-weight:600; text-decoration:none; background:var(--surface-hover); border:1px solid var(--border-light); border-radius:4px; padding:2px 6px; vertical-align:middle; line-height:1; letter-spacing:0.3px; text-transform:uppercase; }
.slack-link:hover { color:var(--accent); border-color:var(--accent); background:var(--accent-soft); }
.slack-link svg { width:10px; height:10px; fill:currentColor; }

/* Status/phase pills */
.pill { display:inline-block; padding:2px 9px; border-radius:10px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.3px; white-space:nowrap; }
.pill-on-track { background:var(--on-track-bg); color:var(--on-track); }
.pill-at-risk { background:var(--at-risk-bg); color:var(--at-risk); }
.pill-blocked { background:var(--blocked-bg); color:var(--blocked); }
.pill-launched { background:var(--launched-bg); color:var(--launched); }
.pill-not-started { background:var(--not-started-bg); color:var(--not-started); border:1px solid rgba(107,96,82,0.15); }
.pill-in-tech { background:var(--in-tech-bg); color:var(--in-tech); }

/* Expanded detail */
.detail-row td { padding:0; }
.detail-content { padding:14px 12px 14px 40px; display:grid; grid-template-columns:1fr 1fr; gap:16px; font-size:13px; }
.detail-section h4 { font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); margin-bottom:6px; }
.detail-section p, .detail-section li { color:var(--text); margin-bottom:3px; }
.detail-section ul { list-style:none; padding:0; }
.detail-section ul li::before { content:"→ "; color:var(--accent); }
.detail-links a { color:var(--accent); text-decoration:none; margin-right:14px; font-size:12px; }
.detail-links a:hover { text-decoration:underline; }

/* Gantt view */
.gantt-container { margin-bottom:24px; }
.gantt-row { display:grid; grid-template-columns:220px 1fr; align-items:center; border-bottom:1px solid var(--border-light); min-height:32px; cursor:pointer; }
.gantt-row:hover { background:var(--surface); }
.gantt-label { padding:6px 12px; font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gantt-milestones { grid-column:1/-1; padding:8px 12px 10px 24px; background:var(--surface); border-bottom:1px solid var(--border-light); }
.gantt-milestones ul { list-style:none; display:grid; grid-template-columns:repeat(3,1fr); gap:4px 16px; font-size:12px; }
.gantt-milestones li { display:flex; justify-content:space-between; gap:8px; padding:2px 0; }
.gantt-milestones li .ms-label { color:var(--text-muted); }
.gantt-milestones li .ms-value { font-weight:600; color:var(--text); }
.gantt-track { position:relative; height:20px; margin:3px 0; }
.gantt-bar { position:absolute; height:100%; border-radius:3px; min-width:4px; }
.gantt-header { display:grid; grid-template-columns:220px 1fr; border-bottom:2px solid var(--border); padding-bottom:6px; margin-bottom:4px; }
.gantt-header .label { font-size:10px; text-transform:uppercase; color:var(--text-muted); padding:0 12px; }
.gantt-weeks { display:flex; justify-content:space-between; padding:0 4px; }
.gantt-weeks span { font-size:9px; color:var(--text-muted); }
.gantt-freeze { position:absolute; background:rgba(181,52,42,0.05); border-left:1px dashed rgba(181,52,42,0.25); border-right:1px dashed rgba(181,52,42,0.25); top:0; bottom:0; z-index:1; }
.gantt-today { position:absolute; width:2px; background:var(--accent); top:0; bottom:0; z-index:2; }
.gantt-dot { position:absolute; width:8px; height:8px; border-radius:50%; top:50%; transform:translate(-50%,-50%); z-index:3; border:1.5px solid #fff; cursor:help; box-shadow:0 0 0 1px rgba(0,0,0,0.15); }
.gantt-dot.ms-done { background:var(--on-track); }
.gantt-dot.ms-pending { background:var(--text-muted); }
.gantt-dot.ms-launch { background:var(--accent); width:9px; height:9px; }
.gantt-ms-row { background:var(--surface); min-height:24px !important; }
.gantt-ms-row:hover { background:var(--surface) !important; }

/* Risks & Watch */
.rw-section { margin-bottom:24px; }
.rw-section h2 { font-size:13px; text-transform:uppercase; letter-spacing:0.5px; color:var(--accent); margin-bottom:14px; font-weight:700; }
.rw-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:10px; }
.rw-card { background:var(--surface); border:1px solid var(--border-light); border-radius:8px; padding:14px 16px; border-left:4px solid var(--border); position:relative; }
.rw-card.sev-high { border-left-color:var(--blocked); }
.rw-card.sev-medium { border-left-color:var(--at-risk); }
.rw-card.sev-watch { border-left-color:var(--in-tech); }
.rw-card-header { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
.rw-card-name { font-weight:600; font-size:13px; color:var(--text); }
.rw-badge { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; padding:2px 7px; border-radius:3px; }
.rw-badge-high { background:var(--blocked-bg); color:var(--blocked); }
.rw-badge-medium { background:var(--at-risk-bg); color:var(--at-risk); }
.rw-badge-watch { background:var(--in-tech-bg); color:var(--in-tech); }
.rw-weeks { font-size:10px; color:var(--text-muted); margin-left:auto; white-space:nowrap; }
.rw-card-body { font-size:13px; color:var(--text); line-height:1.5; margin-bottom:6px; }
.rw-card-action { font-size:12px; color:var(--text-muted); display:flex; align-items:center; gap:4px; }
.rw-card-action strong { color:var(--text); font-weight:600; }
.rw-card-links { display:flex; gap:6px; margin-top:8px; }

/* Launched bucket */
.bucket { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px 24px; margin-bottom:24px; }
.bucket h3 { font-size:13px; font-weight:600; margin-bottom:10px; display:flex; align-items:center; gap:6px; text-transform:uppercase; letter-spacing:0.4px; color:var(--text-muted); }
.bucket-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:8px; }
.bucket-card { background:var(--surface-hover); border:1px solid var(--border-light); border-radius:6px; padding:10px; }
.bucket-card .card-name { font-weight:500; font-size:13px; margin-bottom:3px; color:var(--text); }
.bucket-card .card-meta { font-size:11px; color:var(--text-muted); }

/* Pushed/deferred row */
tbody tr.launched-row { background:var(--launched-bg); }

/* Auto-interpreted tag */
.auto-tag { background:rgba(107,79,168,0.1); color:var(--launched); font-size:9px; padding:1px 5px; border-radius:3px; font-weight:600; margin-left:5px; vertical-align:middle; }

/* Print */
@media print {
  body { background:#fff; color:#000; }
  .controls, .team-nav, .view-toggle { display:none; }
  .stat-card, .bucket, .tldr, .rw-card, table { border-color:#ddd; }
  .stat-card, .tldr, .rw-card { background:#f9f9f9; }
  .container { max-width:100%; padding:12px; }
  table { font-size:11px; }
  .pill { border:1px solid currentColor; }
}

/* Responsive */
@media (max-width:768px) {
  .stats-bar { flex-wrap:wrap; }
  .stat-card { min-width:80px; }
  .detail-content { grid-template-columns:1fr; }
  .search-box { width:100%; }
}
</style>

function renderHeader() {

function renderTldr() {
  const box = document.getElementById('tldrBox');
  const s = DATA.summary;
  const inits = DATA.initiatives;

  // --- Left column: top risks & decisions for leadership ---
  const risks = (DATA.narrative && DATA.narrative.riskRegister) || [];
  const watchItems = (DATA.narrative && DATA.narrative.watchList) || [];

  let left = '<div class="es-snapshot">';
  left += '<div class="es-label">Key Risks & Decisions</div>';

  // Show risk register items (sorted: High first)
  const sortedRisks = [...risks].sort((a,b) => {
    const order = {High:0, Medium:1, Low:2};
    return (order[a.severity]??3) - (order[b.severity]??3);
  });

  if (sortedRisks.length) {
    sortedRisks.forEach(r => {
      const sevColor = r.severity === 'High' ? 'var(--blocked)' : r.severity === 'Medium' ? 'var(--at-risk)' : 'var(--text-muted)';
      const sevBg = r.severity === 'High' ? 'var(--blocked-bg)' : r.severity === 'Medium' ? 'var(--at-risk-bg)' : 'var(--not-started-bg)';
      const actionTip = r.action ? r.action.replace(/"/g,'&quot;') : '';
      left += '<div style="padding:5px 0;border-bottom:1px solid var(--border-light)">';
      left += '<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">';
      left += '<span style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;padding:1px 5px;border-radius:3px;background:'+sevBg+';color:'+sevColor+'">'+r.severity+'</span>';
      left += '<span style="font-weight:600;font-size:12px">'+r.initiative+'</span>';
      const teamBadge = r.team ? '<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:var(--not-started-bg);color:var(--text-muted);font-weight:600;letter-spacing:0.3px;text-transform:uppercase">'+r.team+'</span>' : '';
      left += teamBadge;
      if (r.owner) left += '<span style="font-size:10px;color:var(--text-muted);margin-left:auto">'+r.owner+'</span>';
      left += '</div>';
      left += '<div style="font-size:11px;color:var(--text);line-height:1.35;margin-top:2px" title="Action: '+actionTip+'">'+r.risk+'</div>';
      left += '</div>';
    });
  }

  left += '</div>';

  // --- Right column: movements + watch items ---
  let right = '<div class="es-movements">';
  right += '<div class="es-label">Movements This Week</div>';

  const mvs = (DATA.narrative && DATA.narrative.movements) || [];
  if (mvs.length) {
    const mvOrder = (m) => {
      if (m.to === 'LAUNCHED') return 0;
      const good = {'ON TRACK':1,'IN TECH':1};
      const bad = {'AT RISK':3,'BLOCKED':4};
      if (good[m.to] && !good[m.from]) return 1;
      if (bad[m.to]) return 3;
      return 2;
    };
    const sorted = [...mvs].sort((a,b) => mvOrder(a) - mvOrder(b));

    sorted.forEach(m => {
      right += '<div class="es-mv-item">';
      right += '<span class="es-mv-name">'+m.initiative+'</span>';
      right += '<span class="es-mv-pills">';
      right += '<span class="pill '+pillClass(m.from)+'">'+m.from+'</span>';
      right += '<span class="es-mv-arrow">→</span>';
      right += '<span class="pill '+pillClass(m.to)+'">'+m.to+'</span>';
      right += '</span>';
      if (m.detail) right += '<div style="width:100%;font-size:11px;color:var(--text-muted);line-height:1.3;margin-top:0">'+m.detail+'</div>';
      right += '</div>';
    });
  } else {
    right += '<div style="color:var(--text-muted);font-size:12px;padding:8px 0">No status changes this week.</div>';
  }

  // Watch items in right column, below movements
  if (watchItems.length) {
    right += '<div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--border-light)">';
    right += '<div style="font-size:10px;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-muted);font-weight:600;margin-bottom:4px">Watch Items</div>';
    watchItems.forEach(w => {
      const text = typeof w === 'string' ? w : w.text;
      const owner = (typeof w === 'object' && w.owner) ? w.owner : '';
      const team = (typeof w === 'object' && w.team) ? w.team : '';
      const meta = (owner || team) ? ' <span style="color:var(--text-muted);font-size:10px">('+(team?team:'')+(team&&owner?' · ':'')+owner+')</span>' : '';
      right += '<div style="font-size:12px;padding:3px 0;border-bottom:1px solid var(--border-light);display:flex;align-items:flex-start;gap:4px"><span style="color:var(--in-tech);font-size:10px;margin-top:2px">●</span><span>'+text+meta+'</span></div>';
    });
    right += '</div>';
  }

  right += '</div>';

  box.innerHTML = '<h2>Weekly Pulse</h2><div class="es-grid">'+left+right+'</div>';
}

function renderStats() {
  const s = DATA.summary;
  const prev = DATA.prevSummary || null;
  const items = [
    {v: s.total, l: 'Total', c: 'var(--text)', pv: null, goodUp: true, status: ''},
    {v: s.byStatus['ON TRACK']||0, l: 'On Track', c: 'var(--on-track)', pv: prev ? (prev.byStatus['ON TRACK']||0) : null, goodUp: true, status: 'ON TRACK'},
    {v: s.byStatus['AT RISK']||0, l: 'At Risk', c: 'var(--at-risk)', pv: prev ? (prev.byStatus['AT RISK']||0) : null, goodUp: false, status: 'AT RISK'},
    {v: s.byStatus['BLOCKED']||0, l: 'Blocked', c: 'var(--blocked)', pv: prev ? (prev.byStatus['BLOCKED']||0) : null, goodUp: false, status: 'BLOCKED'},
    {v: s.byStatus['NOT STARTED']||0, l: 'Not Started', c: 'var(--not-started)', pv: prev ? (prev.byStatus['NOT STARTED']||0) : null, goodUp: false, status: 'NOT STARTED'},
    {v: s.launched, l: 'Launched', c: 'var(--launched)', pv: prev ? prev.launched : null, goodUp: true, status: 'LAUNCHED'},
  ];
  const html = items.map(x => {
    let deltaHtml = '';
    if (x.pv !== null && x.pv !== x.v) {
      const diff = x.v - x.pv;
      const isGood = (diff > 0 && x.goodUp) || (diff < 0 && !x.goodUp);
      const cls = isGood ? 'delta-up' : 'delta-down';
      const arrow = diff > 0 ? '▲' : '▼';
      deltaHtml = '<div class="delta '+cls+'">'+arrow+Math.abs(diff)+' vs last week</div>';
    } else if (x.pv !== null) {
      deltaHtml = '<div class="delta delta-neutral">No change</div>';
    }
    const isActive = currentStatus === x.status;
    const activeClass = isActive ? ' active' : '';
    const activeStyle = isActive ? 'border-color:'+x.c+';' : '';
    return '<div class="stat-card'+activeClass+'" style="color:'+x.c+';'+activeStyle+'" onclick="filterByStatus(\''+x.status+'\')"><div class="value" style="color:'+x.c+'">'+x.v+'</div><div class="label">'+x.l+'</div>'+deltaHtml+'</div>';
  }).join('');
  document.getElementById('statsBar').innerHTML = html;
}

function getMovementIcon(initName) {
  const moves = (DATA.narrative && DATA.narrative.movements) || [];
  const m = moves.find(x => x.initiative === initName);
  if (!m) return '';
  if (m.to === 'LAUNCHED') return '<span class="mv-icon mv-launch" title="Launched this week: '+m.detail.replace(/"/g,'&quot;')+'">&#9650;</span>';
  const improved = ['BLOCKED','AT RISK'].includes(m.from) && ['ON TRACK','LAUNCHED'].includes(m.to);
  const degraded = ['ON TRACK','NOT STARTED'].includes(m.from) && ['AT RISK','BLOCKED'].includes(m.to);
  const started = m.from === 'NOT STARTED' && m.to === 'ON TRACK';
  if (improved || started) return '<span class="mv-icon mv-up" title="Improved: '+m.from+' → '+m.to+'. '+m.detail.replace(/"/g,'&quot;')+'">&#9650;</span>';
  if (degraded) return '<span class="mv-icon mv-down" title="Degraded: '+m.from+' → '+m.to+'. '+m.detail.replace(/"/g,'&quot;')+'">&#9660;</span>';
  return '';
}

function getFilteredInits() {
  const sf = currentStatus || document.getElementById('statusFilter').value;
  const pf = document.getElementById('phaseFilter').value;
  const of = document.getElementById('ownerFilter').value;
  let inits = getAllInits();
  if (currentTeam !== 'all') inits = inits.filter(i => i.team === currentTeam);
  const search = document.getElementById('searchBox').value.toLowerCase();
  if (search) inits = inits.filter(i => i.name.toLowerCase().includes(search) || i.bizOwner.toLowerCase().includes(search) || i.engLead.toLowerCase().includes(search));
  if (sf === 'LAUNCHED') {
    inits = inits.filter(i => i.phase === 'LAUNCHED');
  } else if (sf) {
    inits = inits.filter(i => i.status === sf && i.phase !== 'LAUNCHED');
  }
  if (pf) {
    inits = inits.filter(i => i.phase === pf);
  }
  if (of) {
    inits = inits.filter(i => i.bizOwner === of);
  }
  const ef = document.getElementById('engLeadFilter').value;
  if (ef) {
    inits = inits.filter(i => i.engLead === ef);
  }
  inits.sort((a,b) => {
    let va, vb;
    if (sortCol === 'launch') {
      va = a.milestones.launch || ''; vb = b.milestones.launch || '';
    } else {
      va = a[sortCol] || ''; vb = b[sortCol] || '';
    }
    if (sortCol === 'status') {
      const order = {'BLOCKED':0,'AT RISK':1,'ON TRACK':2,'NOT STARTED':3,'LAUNCHED':4};
      va = order[va] ?? 5; vb = order[vb] ?? 5;
    }
    if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
  return inits;
}

function pillClass(status) {
  if (status === 'IN TECH') return 'pill-in-tech';
  return 'pill-' + status.toLowerCase().replace(/\s+/g, '-');

      html += '<p><strong>Notes:</strong> '+i.notes+'</p>';
      html += '<p><strong>Last Updated:</strong> '+i.lastUpdated+'</p>';
      html += '<div class="detail-links" style="margin-top:10px">';
      if (i.prd && i.prd !== 'TBD' && !i.prd.startsWith('Draft')) html += '<a href="'+i.prd+'" target="_blank" onclick="event.stopPropagation()">PRD ↗</a>';
      if (i.epic && i.epic !== 'TBD') html += '<a href="https://redventures.atlassian.net/browse/'+i.epic+'" target="_blank" onclick="event.stopPropagation()">'+i.epic+' ↗</a>';
      if (i.slackChannel) html += '<a class="slack-link" href="https://redventures.slack.com/archives/'+i.slackChannel+'" target="_blank" onclick="event.stopPropagation()" title="Open Slack channel"><svg viewBox="0 0 24 24"><path d="M5.042 15.165a2.528 2.528 0 0 1-2.52 2.523A2.528 2.528 0 0 1 0 15.165a2.527 2.527 0 0 1 2.522-2.52h2.52v2.52zm1.271 0a2.527 2.527 0 0 1 2.521-2.52 2.527 2.527 0 0 1 2.521 2.52v6.313A2.528 2.528 0 0 1 8.834 24a2.528 2.528 0 0 1-2.521-2.522v-6.313zM8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zm0 1.271a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312zm10.122 2.521a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zm-1.268 0a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312zm-2.523 10.122a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zm0-1.268a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z"/></svg>Slack</a>';
      html += '</div></div></div></td></tr>';
    }
  });
  html += '</tbody></table>';
  document.getElementById('tableView').innerHTML = html;
  updateFilterCount();
}

function renderGantt() {
  const inits = getFilteredInits();
  const rangeStart = new Date('2026-10-26');
  const rangeEnd = new Date('2027-03-08');
  const totalDays = (rangeEnd - rangeStart) / (1000*60*60*24);
  const freezeStart = new Date(DATA.meta.codeFreeze.start);
  const freezeEnd = new Date(DATA.meta.codeFreeze.end);
  const today = new Date();

  function pct(d) { return Math.max(0, Math.min(100, ((d - rangeStart) / (1000*60*60*24)) / totalDays * 100)); }

  const weeks = [];
  let d = new Date(rangeStart);
  while (d <= rangeEnd) { weeks.push(d.toISOString().slice(5,10)); d.setDate(d.getDate() + 7); }

  let html = '<div class="gantt-header"><div class="label">Initiative</div><div class="gantt-weeks">';
  weeks.forEach(w => html += '<span>'+w+'</span>');
  html += '</div></div>';

  inits.forEach(i => {
    const ms = i.milestones;
    let start = parseGanttDate(ms.techStart);
    let end = parseGanttDate(ms.launch) || parseGanttDate(ms.techEnd);
    if (!start || !end) { start = today; end = today; }
    const left = pct(start);
    const width = Math.max(1, pct(end) - left);
    const color = teamColor(i.team);
    const statusBorder = i.status === 'AT RISK' ? 'border:2px solid var(--at-risk)' : i.status === 'BLOCKED' ? 'border:2px solid var(--blocked)' : '';
    const gExp = expandedGanttRows.has(i.id);
    html += '<div class="gantt-row" onclick="toggleGanttRow(\''+i.id+'\')">';
    html += '<div class="gantt-label" style="color:'+color+';font-weight:600">'+i.name+'</div>';
    html += '<div class="gantt-track" style="position:relative">';
    html += '<div class="gantt-freeze" style="left:'+pct(freezeStart)+'%;width:'+(pct(freezeEnd)-pct(freezeStart))+'%"></div>';
    // Thanksgiving freeze band
    if (DATA.meta.holidays && DATA.meta.holidays.thanksgiving) {
      const tgStart = new Date(DATA.meta.holidays.thanksgiving[0]);
      const tgEnd = new Date(DATA.meta.holidays.thanksgiving[DATA.meta.holidays.thanksgiving.length-1]);
      tgEnd.setDate(tgEnd.getDate()+1); // inclusive end
      html += '<div class="gantt-freeze" style="left:'+pct(tgStart)+'%;width:'+(pct(tgEnd)-pct(tgStart))+'%" title="Thanksgiving (Nov 26-27)"></div>';
    }
    html += '<div class="gantt-today" style="left:'+pct(today)+'%"></div>';
    html += '<div class="gantt-bar" style="left:'+left+'%;width:'+width+'%;background:'+color+';opacity:0.65;'+statusBorder+'" title="'+i.name+': '+ms.techStart+' → '+ms.launch+'"></div>';
    // Milestone dots only shown in expanded dropdown rows
    html += '</div></div>';
    if (gExp) {
      const msDots = [
        {key:'creativeDone',label:'Creative Done'},
        {key:'handoffToTech',label:'Handoff to Tech'},
        {key:'techStart',label:'Tech Start'},
        {key:'techEnd',label:'Tech Done'},
        {key:'uatDone',label:'UAT Done'},
        {key:'launch',label:'Launch'}
      ];
      // Milestone dots row aligned to same date axis
      html += '<div class="gantt-row gantt-ms-row" style="cursor:default;min-height:28px">';
      html += '<div class="gantt-label" style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.4px">Milestones</div>';
      html += '<div class="gantt-track" style="position:relative;height:20px">';
      msDots.forEach(md => {
        const val = ms[md.key];
        const dt = parseGanttDate(val);
        if (!dt) return;
        const dotLeft = pct(dt);
        const isDone = val === 'Complete' || val === 'Q3' || val === 'Q2 rollover' || val === 'Q3 rollover';
        const isLaunch = md.key === 'launch';
        const cls = isLaunch ? 'ms-launch' : isDone ? 'ms-done' : 'ms-pending';
        html += '<div class="gantt-dot '+cls+'" style="left:'+dotLeft+'%" title="'+md.label+': '+(val||'TBD')+'"></div>';
      });
      html += '</div></div>';
      // Milestone detail list
      const msNames = {creativeDone:'Creative Done',handoffToTech:'Handoff to Tech',techStart:'Tech Start',techEnd:'Tech Done',uatDone:'UAT Done',launch:'Launch'};
      html += '<div class="gantt-milestones"><ul>';
      Object.entries(msNames).forEach(([k,label]) => {
        html += '<li><span class="ms-label">'+label+'</span><span class="ms-value">'+(ms[k]||'TBD')+'</span></li>';
      });
      html += '</ul></div>';
    }
  });
  // Gantt legend
  html += '<div style="display:flex;gap:16px;padding:8px 12px;font-size:10px;color:var(--text-muted);border-top:1px solid var(--border-light);align-items:center">';
  html += '<span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:2px;background:var(--accent);display:inline-block"></span>Today</span>';
  html += '<span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:8px;background:repeating-linear-gradient(45deg,rgba(192,57,43,0.06),rgba(192,57,43,0.06) 2px,transparent 2px,transparent 5px);border:1px solid rgba(192,57,43,0.15);display:inline-block;border-radius:2px"></span>Code Freeze / Holiday</span>';
  html += '<span style="display:flex;align-items:center;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:var(--on-track);display:inline-block"></span>Done</span>';
  html += '<span style="display:flex;align-items:center;gap:4px"><span style="width:6px;height:6px;border-radius:50%;background:var(--text-muted);display:inline-block"></span>Pending</span>';
  html += '<span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block"></span>Launch</span>';
  html += '</div>';

  document.getElementById('ganttView').innerHTML = html;
}

function parseGanttDate(s) {
  if (!s || s === 'TBD' || s === 'N/A') return null;
  if (s === 'Complete' || s === 'Q3' || s === 'Q2 rollover' || s === 'Q3 rollover') return new Date('2026-10-01');
  const months = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
  const m = s.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d+)$/);
  if (m) {
    const yr = months[m[1]] >= 10 ? 2026 : 2027;
    return new Date(yr, months[m[1]], parseInt(m[2]));
  }
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function findInitByName(name) {
  return DATA.initiatives.find(i => i.name === name || name.includes(i.name) || i.name.includes(name));
}

}

function renderRisksAndWatch() {
  // Risks & watch items are now merged into the Executive Summary
  document.getElementById('risksAndWatch').innerHTML = '';
}

function renderBuckets() {
  // Launched initiatives are now shown in the main table — no separate bucket needed
  document.getElementById('launchedBucket').innerHTML = '';
}

function filterTeam(t) {
  currentTeam = t;
  renderTeamNav();
  renderTable();
  renderGantt();
}

function setView(v) {
  currentView = v;
  document.querySelectorAll('.view-toggle button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  document.getElementById('tableView').style.display = v === 'table' ? '' : 'none';
  document.getElementById('ganttView').style.display = v === 'gantt' ? '' : 'none';
  if (v === 'gantt') renderGantt();
}

function doSort(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = true; }
  renderTable();
}

function toggleRow(id) {
  if (expandedRows.has(id)) expandedRows.delete(id);
  else expandedRows.add(id);
  renderTable();
}

function toggleGanttRow(id) {
  if (expandedGanttRows.has(id)) expandedGanttRows.delete(id);
  else expandedGanttRows.add(id);
  renderGantt();
}

function updateFilterCount() {
  const total = getAllInits().length;
  const filtered = getFilteredInits().length;
  const el = document.getElementById('filterCount');
  if (filtered < total) el.textContent = 'Showing ' + filtered + ' of ' + total;
  else el.textContent = '';
}

document.getElementById('searchBox').addEventListener('input', () => { renderTable(); renderGantt(); });
document.getElementById('statusFilter').addEventListener('change', () => { renderTable(); renderGantt(); });
document.getElementById('phaseFilter').addEventListener('change', () => { renderTable(); renderGantt(); });
document.getElementById('ownerFilter').addEventListener('change', () => { renderTable(); renderGantt(); });
document.getElementById('engLeadFilter').addEventListener('change', () => { renderTable(); renderGantt(); });

function populateOwnerFilter() {
  const owners = new Set();
  const leads = new Set();
  DATA.initiatives.forEach(i => {
    if (i.bizOwner) owners.add(i.bizOwner);
    if (i.engLead) leads.add(i.engLead);
  });
  const sel = document.getElementById('ownerFilter');
  [...owners].sort().forEach(o => {
    const opt = document.createElement('option');
    opt.value = o;
    opt.textContent = o;
    sel.appendChild(opt);
  });
  const sel2 = document.getElementById('engLeadFilter');
  [...leads].sort().forEach(o => {
    const opt = document.createElement('option');
    opt.value = o;
    opt.textContent = o;
    sel2.appendChild(opt);
  });
}

init();
</script>
